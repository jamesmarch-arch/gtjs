<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electric Blast Furnace</title>
<script src="cf-head.js"></script></head><body>
<script src="core.js"></script>
<script src="gt-bridge.js"></script>
<script src="gt-parts.js"></script>
<script>
/* Electric Blast Furnace (gtjs, MV): GregTech's first multiblock, 3 x 3 blocks and 4 tall.

   How it works (truth first)
   1. MV power comes in by copper cable to the energy hatch on the left side. Inside, two copper bus bars carry it up
      to the coils.
   2. The two middle layers are rings of eight cupronickel coil blocks round a hollow core. Current through the
      coils heats the core: cupronickel reaches 1800 K. Steel needs 1000 K; aluminium 1700 K.
   3. The charge comes in through the input bus (front left) and sits on the hearth, the top of the bottom-centre
      casing. It heats, melts and sets as an ingot, which leaves through the output bus (front right) into the tray.
   4. Fumes rise out of the core through the muffler hatch on the roof. The controller (front centre) shows the
      temperature; the maintenance hatch at the back is where GT asks for its tools.
   Where the metal is: input bus -> hearth -> (melts) -> ingot -> output bus -> tray.
   Where the power is: copper cable -> energy hatch -> bus bars -> coils -> heat.

   x = depth (front at x = 300), y = width (+y = viewer-left), z = up. 1 unit = 1 cm; one block is 100.

   Parts
   CASING   heat proof casings (bottom and top layers) . controller with screen and lamp . input bus . output bus .
            energy hatch with its copper cable . maintenance hatch . muffler hatch with fan grille . output tray
   CORE     16 cupronickel coil blocks in two rings . coil windings round the core . hearth . charge . ingot .
            two bus bars from the energy hatch to the coils

   Contact checks (numbers)
   - coil rings: layers z 100..300, the core is the centre column x 100..200, y 100..200.
   - hearth: the top of the bottom-centre casing, z 100; the charge sits on it, inside the coil rings.
   - bus bars: from the energy hatch (y 200..300, z 0..100) up the core's left wall (y 206) to the lower ring (z 110).
   - muffler: the top-centre block, over the core; fumes leave its top face at z 400.
*/
const B = 100, H = 400;
Z_FLOOR = 0;
const CASE = { l:'#efe6d5', m:'#cfc3ac', d:'#5e5546' }, COIL = { l:'#e7a578', m:'#c98055', d:'#6b3a1f' };
const TRAY = [302, 12, 334, 88], TRAY_H = 10;
const tempK = st => Math.round(300 + 1500*gtClamp(st.heat || 0));
const isSteel = st => !st.recipe || /steel/.test(st.recipe.id);
const ingotCol = st => isSteel(st) ? '#8e979c' : '#d6dde2';

/* ---------- the structure: what each of the 36 places holds ---------- */
function blockAt(i, j, l){
  if ((l === 1 || l === 2)) return i === 1 && j === 1 ? null : 'coil';
  if (l === 3) return i === 1 && j === 1 ? 'muffler' : 'casing';
  return { '2,1': 'controller', '2,2': 'input', '2,0': 'output', '1,2': 'energy', '0,1': 'maintenance' }[`${i},${j}`] || 'casing';
}
// the four corners of one face of block (i, j, l), inset by `ins`, lifted off the face by `off`
function facePts(i, j, l, n, ins = 0, off = .3){
  const x0 = i*B, y0 = j*B, z0 = l*B, x1 = x0 + B, y1 = y0 + B, z1 = z0 + B;
  if (n === 'x+') return [[x1 + off, y0 + ins, z0 + ins], [x1 + off, y1 - ins, z0 + ins], [x1 + off, y1 - ins, z1 - ins], [x1 + off, y0 + ins, z1 - ins]];
  if (n === 'x-') return [[x0 - off, y0 + ins, z0 + ins], [x0 - off, y1 - ins, z0 + ins], [x0 - off, y1 - ins, z1 - ins], [x0 - off, y0 + ins, z1 - ins]];
  if (n === 'y+') return [[x0 + ins, y1 + off, z0 + ins], [x1 - ins, y1 + off, z0 + ins], [x1 - ins, y1 + off, z1 - ins], [x0 + ins, y1 + off, z1 - ins]];
  if (n === 'y-') return [[x0 + ins, y0 - off, z0 + ins], [x1 - ins, y0 - off, z0 + ins], [x1 - ins, y0 - off, z1 - ins], [x0 + ins, y0 - off, z1 - ins]];
  return [[x0 + ins, y0 + ins, z1 + off], [x1 - ins, y0 + ins, z1 + off], [x1 - ins, y1 - ins, z1 + off], [x0 + ins, y1 - ins, z1 + off]];
}
const NORMAL = { 'x+':[1,0,0], 'x-':[-1,0,0], 'y+':[0,1,0], 'y-':[0,-1,0], 'z+':[0,0,1] };
// the faces of a block that are on the outside of the structure and turned toward the viewer
function outerFaces(i, j, l){
  const out = [];
  if (i === 2) out.push('x+'); if (i === 0) out.push('x-'); if (j === 2) out.push('y+'); if (j === 0) out.push('y-'); if (l === 3) out.push('z+');
  return out.filter(n => facing(NORMAL[n]));
}

function ebfBlock(st, i, j, l){
  const kind = blockAt(i, j, l), hot = gtClamp(st.heat || 0);
  const m = kind === 'coil' ? (hot > .05 ? { l: mix(COIL.l, '#ffb36a', hot*.6), m: mix(COIL.m, '#e8743a', hot*.55), d: mix(COIL.d, '#8a3a16', hot*.4) } : COIL) : CASE;
  let s = box(i*B, j*B, l*B, i*B + B, j*B + B, l*B + B, m, tone, 1.3);
  for (const n of outerFaces(i, j, l)){
    if (kind === 'coil'){
      // the windings run round the block: horizontal lines across each side face
      let d = ''; for (let z = 12; z < B; z += 12){ const p = facePts(i, j, l, n, 6, .3), zz = l*B + z;
        d += pd([[p[0][0], p[0][1], zz], [p[1][0], p[1][1], zz]], false); }
      s += `<path d="${d}" fill="none" stroke="${hot > .3 ? mix(COIL.d, GT.HOT, hot) : COIL.d}" stroke-width="1.3"/>`;
      if (hot > .3) s += fill(pd(facePts(i, j, l, n, 0, .35)), GT.GLOW, `opacity="${f((hot - .3)*.35)}"`);
      continue;
    }
    // casings: an inset panel with four bolts
    s += shape(facePts(i, j, l, n, 9, .3), mix(CASE.l, '#ffffff', .25), .9);
    const q = facePts(i, j, l, n, 15, .35);
    s += q.map(p => fill(pd(n[0] === 'z' ? on(PZ(p[2]), ellUV(p[0], p[1], 1.8, 1.8, 8)) : n[0] === 'x' ? on(PX(p[0]), ellUV(p[1], p[2], 1.8, 1.8, 8)) : on(PY(p[1]), ellUV(p[0], p[2], 1.8, 1.8, 8))), CASE.d)).join('');
  }
  // the special blocks' fronts
  if (kind === 'controller' && facing([1,0,0])){
    const fx = 3*B + .5;
    s += shape([[fx, 116, 34], [fx, 184, 34], [fx, 184, 82], [fx, 116, 82]], '#1d2a26', 1.2);
    s += tx(fx + .1, 150, 66, 'EBF', 9, '#8af0ae', 800) + tx(fx + .1, 150, 48, st.needsMv ? 'NEEDS MV' : `${tempK(st)} K`, st.needsMv ? 6.5 : 8, st.needsMv ? '#ff8a6a' : '#8af0ae', 800);
    s += cylX(3*B, 3*B + 2.5, 150, 18, 4, matOf(st.lamp === 'on' ? '#43c25c' : st.lamp === 'stalled' ? '#e2483d' : '#5d5650'), toneI, 1, 14);
  }
  if ((kind === 'input' || kind === 'output') && facing([1,0,0])){
    const fx = 3*B + .5, y0 = j*B + 16, y1 = j*B + 84;
    s += shape([[fx, y0, 16], [fx, y1, 16], [fx, y1, 74], [fx, y0, 74]], '#3a3632', 1.2);
    let g = ''; for (let k = 1; k < 6; k++){ const y = y0 + (y1 - y0)*k/6; g += pd([[fx + .1, y, 18], [fx + .1, y, 72]], false); }
    s += `<path d="${g}" fill="none" stroke="#6b655d" stroke-width="1.4"/>` + tx(fx + .2, j*B + 50, 84, kind === 'input' ? 'IN' : 'OUT', 8, INK, 800);
  }
  if (kind === 'energy' && facing([0,1,0])){
    const fy = 3*B + .5;
    s += shape([[120, fy, 20], [180, fy, 20], [180, fy, 80], [120, fy, 80]], '#3a3632', 1.2);
    s += shape(on(PY(fy + .1), ellUV(150, 50, 14, 14, 20)), COIL.m, 1) + shape(on(PY(fy + .2), ellUV(150, 50, 7, 7, 16)), '#2b2523', .8);
    s += txY(150, fy + .2, 86, 'MV', 8, INK, 800);
  }
  if (kind === 'maintenance' && facing([-1,0,0])){
    s += shape([[-.5, 125, 25], [-.5, 175, 25], [-.5, 175, 75], [-.5, 125, 75]], mix(CASE.m, CASE.d, .3), 1.1);
    s += gtRivets(PX(-.6), [[130, 30], [170, 30], [130, 70], [170, 70]], INK);
  }
  if (kind === 'muffler'){
    const z = H + .4, c = [150, 150], a0 = (st.t || 0)*4;
    s += shape(on(PZ(z), ellUV(...c, 36, 36, 28)), '#3a3632', 1.4);
    let blades = ''; for (let k = 0; k < 6; k++){ const a = a0 + k*Math.PI/3; blades += pd([[c[0], c[1], z + .1], [c[0] + 30*Math.cos(a), c[1] + 30*Math.sin(a), z + .1]], false); }
    s += `<path d="${blades}" fill="none" stroke="#8a857d" stroke-width="3" stroke-linecap="round"/>` + shape(on(PZ(z + .2), ellUV(...c, 7, 7, 14)), '#8a857d', .8);
  }
  return s;
}

function ebfStructure(st){
  const parts = [];
  for (let l = 0; l < 4; l++) for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++){
    if (!blockAt(i, j, l)) continue;
    parts.push({ box:[[i*B, j*B, l*B], [i*B + B, j*B + B, l*B + B]], svg: ebfBlock(st, i, j, l) });
  }
  return parts;
}

/* ---------- outside: the energy cable, the output tray ---------- */
function ebfCable(){
  const p = [[150, 3*B, 50], [150, 3*B + 7, 50], [150, 3*B + 7, 4], [150, 3*B + 10, 4]], d = pd(p, false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#3d3935" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>`
    + `<path d="${d}" fill="none" stroke="${COIL.l}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
}
function ebfTray(st){
  const [x0, y0, x1, y1] = TRAY, A = on(PZ(0), rectUV(x0, y0, x1, y1)), Bt = on(PZ(TRAY_H), rectUV(x0, y0, x1, y1));
  let inner = fill(pd(on(PZ(.6), rectUV(x0 + .6, y0 + .6, x1 - .6, y1 - .6))), GT.IRON.d);
  const bars = [];
  for (let k = 0; k < Math.min(8, st.output | 0); k++){ const at = [310 + (k % 2)*14, 22 + Math.floor(k/2)*18, .7];
    bars.push({ box:[[at[0] - 6, at[1] - 4, .7], [at[0] + 6, at[1] + 4, 4]], svg: ebfIngot(at, ingotCol(st), 0) }); }
  inner += byDepth(bars);
  return openShell(A, Bt, n => toneI(n, GT.IRON), inner) + ink(pd(Bt), 1.4) + hullInk([...A, ...Bt], 1.8);
}
const ebfIngot = ([x, y, z], col, hot) => { const c = hot > 0 ? mix(col, GT.HOT, hot*.85) : col, m = { l: c, m: mix(c, '#000000', .15), d: mix(c, '#000000', .4) };
  return box(x - 6, y - 4, z, x + 6, y + 4, z + 3.2, m, toneI, .8); };

/* ---------- see-through: the core ---------- */
let EBF_LABELS = '';
function ebfCore(st, k){
  const p = st.progress || 0, active = !!st.active, hot = gtClamp(st.heat || 0), col = ingotCol(st);
  // the windings round the core, split into the half behind the charge and the half in front of it
  const dc = depthOf([150, 150, 200]); let far = '', near = '';
  for (let z = 114; z <= 290; z += 22){
    const ring = [[94, 94, z], [206, 94, z], [206, 206, z], [94, 206, z]];
    for (let q = 0; q < 4; q++){ const a = ring[q], b = ring[(q + 1) % 4], d = pd([a, b], false);
      if (depthOf([(a[0] + b[0])/2, (a[1] + b[1])/2, z]) < dc) far += d; else near += d; }
  }
  const wind = hot > .05 ? mix(COIL.m, '#ff6a2a', hot*.7) : COIL.m;
  const coil = d => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="3"/><path d="${d}" fill="none" stroke="${wind}" stroke-width="1.7"/>`
    + (hot > .3 ? `<path d="${d}" fill="none" stroke="${GT.GLOW}" stroke-width="5" opacity="${f((hot - .3)*.3)}"/>` : '');
  // the charge on the hearth: lumps, then a glowing pool, then an ingot
  let charge = '';
  if (active){
    if (p < .55){ const n = 5, melt = gtClamp((p - .1)/.45);
      for (let q = 0; q < n; q++){ const at = [135 + (q % 3)*14, 140 + Math.floor(q/3)*16, 104];
        charge += gtLump(at, 1.6*(1 - .7*melt), isSteel(st) ? GT.ORE.iron : '#d6dde2', hot > .4 ? { l: mix(GT.ROCK.l, GT.HOT, hot*.6), m: mix(GT.ROCK.m, GT.GLOW, hot*.5), d: GT.ROCK.d } : GT.ROCK); } }
    if (p >= .3 && p < .8){ const r = 10 + 14*gtClamp((p - .3)/.3);
      charge += fill(pd(on(PZ(100.6), ellUV(150, 150, r, r*.9, 20))), mix(col, GT.HOT, .85)) + fill(pd(on(PZ(100.7), ellUV(150, 150, r*.5, r*.45, 16))), '#fff4b8', 'opacity=".7"'); }
    if (p >= .8) charge += ebfIngot([150, 150, 100.5], col, gtClamp(1 - (p - .8)/.2));
  }
  // bus bars from the energy hatch up the core's left wall
  const bar = x => rod([x, 260, 70], [x, 210, 70], 2.4, GT.COPPER, toneI, .7) + rod([x, 210, 70], [x, 210, 112], 2.4, GT.COPPER, toneI, .7);
  EBF_LABELS = k <= .6 ? '' : xrCallouts([
    { at: [94, 150, 250], text: 'COIL WINDINGS', on: hot > .3 },
    { at: [150, 150, 106], text: 'HEARTH', on: active },
    ...(active ? [{ at: [150, 150, 112], text: 'CHARGE', on: p < .8 }] : []),
    { at: [150, 230, 70], text: 'BUS BARS', on: !!st.running },
    { at: [150, 300, 50], text: 'ENERGY HATCH', on: !!st.running },
    { at: [150, 150, H], text: 'MUFFLER', on: !!st.running } ], [0, 334, 0, 312, 0, 440]);
  return coil(far) + charge + coil(near) + bar(140) + bar(160);
}

/* ---------- scene ---------- */
function scene(st, m){
  const k = ease(st.xr || 0);
  let s = castShadow([[0, 0, 0], [3*B, 0, 0], [3*B, 3*B, 0], [0, 3*B, 0], [0, 0, H], [3*B, 0, H], [3*B, 3*B, H], [0, 3*B, H]]);
  // the floor things first, then the 36 blocks (they sort cleanly on their grid), then the core over the ghost
  const solid = byDepth([
    { box:[[TRAY[0], TRAY[1], 0], [TRAY[2], TRAY[3], TRAY_H]], svg: ebfTray(st) },
    { box:[[146, 3*B, 0], [154, 3*B + 10, 54]], svg: ebfCable() },
    ...ebfStructure(st) ]);
  // see-through: paper under the footprint, so the cast shadow doesn't show through the ghosted blocks
  if (k > 0) s += fill(pd(on(PZ(0), rectUV(0, 0, 3*B, 3*B))), '#f2efe7', `opacity="${f(.85*k)}"`)
    + `<g opacity="${f(1 - .78*k)}">${solid}</g><g opacity="${f(k)}">${ebfCore(st, k)}</g>`;
  else s += solid;
  s += gtPuffsSvg(st);
  if (k > .6) s += EBF_LABELS;
  else s += xrCallouts([
    ...(facing([1,0,0]) ? [{ at: [3*B, 150, 82], text: 'CONTROLLER', on: !!st.running }, { at: [3*B, 250, 74], text: 'INPUT BUS', on: !!st.active && (st.progress || 0) < .1 },
                           { at: [3*B, 50, 74], text: 'OUTPUT BUS', on: !!st.active && (st.progress || 0) > .9 }] : []),
    ...(facing([0,1,0]) ? [{ at: [150, 3*B, 80], text: 'ENERGY HATCH', on: !!st.running }] : []),
    { at: [3*B, 3*B, 250], text: 'CUPRONICKEL COILS', on: (st.heat || 0) > .3 },
    { at: [150, 150, H], text: 'MUFFLER', on: !!st.running },
    ...(facing([-1,0,0]) ? [{ at: [0, 150, 75], text: 'MAINTENANCE HATCH', on: false }] : []) ], [0, 334, 0, 312, 0, 440]);
  return s;
}

gtMachine({
  fig:'MV1', title:'Electric Blast Furnace', size:[334, 312, 440], center:[167, 156], scene, heatTime: 5, demoSeconds: 8,
  recipes:[{ id:'ebf_steel', name:'Steel Ingot' }, { id:'ebf_aluminium', name:'Aluminium Ingot' }],
  toggleLabel:'Power', loadLabel:'Load charge', inLabel:'Charge', outLabel:'Made',
  stats: st => [{ label:'Temperature', value: `${tempK(st)} K` }, { label:'Progress', value: st.active ? `${Math.round((st.progress || 0)*100)}%` : '-', small:true },
                { label:'Made', value: st.output | 0, small:true }],
  emitters:[{ id:'fumes', kind:'smoke', at: () => [150, 150, H + 2], when: st => !!st.running, every:.3, life:2.4, rise:60, r0:6 }],
  tile:[[-3, -3, 0], [303, -3, 0], [303, 303, 0], [-3, 303, 0]],
});
</script>
<script src="cf-tail.js"></script>
</body></html>
