<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crafting Terminal</title>
<script src="cf-head.js"></script></head><body>
<script src="core.js"></script>
<script src="gt-bridge.js"></script>
<script src="gt-parts.js"></script>
<script src="gt-lv.js"></script>
<script>
/* Crafting Terminal (gtjs, LV, after Applied Energistics 2): a screen onto the storage network. It shows what the
   network holds as a grid of items; ask it for something the network can make and it hands the job to a crafting
   CPU, then shows the job's progress until the item is in storage.

   How it works (truth first)
   1. The radio under the antenna keeps the terminal on the shared storage network (gtjs has no data cables: the
      network is one store). The control board asks the network what it holds and draws it on the screen: a search
      bar, three rows of six item slots, a status line.
   2. A request typed on the keyboard (or picked on the screen) goes over the radio to a crafting CPU, which plans it
      and runs it. While the job runs (running) the item being made is ringed on the screen and the progress bar
      under the grid fills (progress 0..1).
   3. The screen is a panel in the face recess, lit from behind; a driver board on its back takes the picture from
      the control board. The keyboard's lead runs in through the face to the board.
   Where the power is: cable -> socket -> control board -> screen driver, radio. Where a request goes: keyboard ->
   board -> radio -> crafting CPU; the picture: board -> driver -> screen.

   Parts
   OUTSIDE  the LV case (see gt-lv.js) . screen in the face recess: search bar, 18 item slots with icons, status line,
            progress bar . keyboard on a shelf with two brackets . antenna with a lamp at the tip on the roof
   INSIDE   screen panel . screen driver board . radio with its feed up the mast . keyboard lead . control board and
            its power lead (gt-lv.js)

   Contact checks (numbers)
   - screen y 11..69, z 18..57 inside the face recess (8..72, 15..60); search bar z 52.5..55.5; slots 7 square,
     1.2 apart, y 15.4..64.6, rows from z 51 down to 27.6; status line z 20..25.
   - shelf x 74..84, y 14..66, z 10.5..13, under the recess (z 15) and above the feet; brackets x 74..79 at y 17..19
     and 61..63 from z 7 to the shelf; keys 3 rows of 11 on its top.
   - antenna at (x 50, y 60) on the roof, clear of the grille (x 6..26): base r 4 z 84..87, mast to z 102, lamp to 104.5.
   - radio x 44..56, y 52..68, z 66..76 on the back of the roof, its feed straight up at (50, 60) to the base.
   - screen panel x 64..72 behind the face (x 74); driver board x 61.5..64 on its back.
*/
const TM = { s: 7, g: 1.2, y0: 64.6, rows: [51, 42.8, 34.6], ant: [50, 60] };
const TM_COL = { iron:'#c9ced1', copper:'#e5874c', tin:'#dcdad0', bronze:'#e0a050', steel:'#8e979c', gold:'#f2c94c', nickel:'#d8d6a8' };
// what the network holds: 18 items, as on the screen left to right, top to bottom
const TM_ITEMS = [['ingot','iron'], ['ingot','copper'], ['ingot','tin'], ['ingot','bronze'], ['plate','iron'], ['plate','bronze'],
  ['dust','copper'], ['dust','iron'], ['wire','copper'], ['gear','bronze'], ['circuit'], ['tube'],
  ['dust','nickel'], ['ingot','steel'], ['wire','tin'], ['plate','copper'], ['gear','iron'], ['ingot','gold']];
const TM_JOB = 10;   // the slot of the item being made (the circuit)
const tmProg = st => gtBridge.embedded || st.progFixed ? gtClamp(st.progress || 0) : ((st.t || 0)*.18) % 1;
const tmSlot = i => { const c = i % 6, r = Math.floor(i/6), y1 = TM.y0 - c*(TM.s + TM.g); return [y1 - TM.s, TM.rows[r] - TM.s, y1, TM.rows[r]]; };

// an item icon drawn flat on the screen, centred on (cy, cz), r: half its size
function tmIcon([kind, mat], cy, cz, r){
  const c = TM_COL[mat] || '#c9ced1', d = mix(c, '#000000', .35), o = uv => lvOn(uv, .62);
  if (kind === 'ingot') return shape(o([[cy + r, cz - r*.4], [cy - r, cz - r*.4], [cy - r*.6, cz + r*.4], [cy + r*.6, cz + r*.4]]), c, .35)
    + fill(pd(o([[cy + r*.55, cz + r*.05], [cy - r*.55, cz + r*.05], [cy - r*.45, cz + r*.3], [cy + r*.45, cz + r*.3]])), '#ffffff', 'opacity=".35"');
  if (kind === 'plate') return shape(o([[cy + r, cz - r*.55], [cy - r*.3, cz - r*.55], [cy - r, cz + r*.55], [cy + r*.3, cz + r*.55]]), c, .35);
  if (kind === 'dust') return shape(o([...arcUV(cy, cz - r*.5, r, 0, 180, 8)]), c, .35) + fill(pd(o(ellUV(cy + r*.3, cz, r*.2, r*.2, 6))), d);
  if (kind === 'wire') return shape(o(ellUV(cy, cz, r*.85, r*.85, 14)), c, .35) + shape(o(ellUV(cy, cz, r*.35, r*.35, 10)), '#14201c', .3);
  if (kind === 'gear') return shape(o(lvGear(cy, cz, r*.6, 6, .2, r*.3)), c, .35) + fill(pd(o(ellUV(cy, cz, r*.22, r*.22, 8))), '#14201c');
  if (kind === 'tube') return shape(o(rrUV(cy - r*.4, cz - r, cy + r*.4, cz + r*.7, r*.4)), '#d6e4ea', .35) + fill(pd(o(rectUV(cy - r*.25, cz - r*.1, cy + r*.25, cz + r*.15))), '#f2a35a');
  // circuit: a green board with gold pads
  return shape(o(rectUV(cy - r*.85, cz - r*.7, cy + r*.85, cz + r*.7)), GT_PCB.l, .35)
    + [[-.45, .35], [.45, .35], [-.45, -.35], [.45, -.35]].map(([a, b]) => fill(pd(o(rectUV(cy + a*r - r*.15, cz + b*r - r*.12, cy + a*r + r*.15, cz + b*r + r*.12))), '#f2c94c')).join('');
}

function tmFace(st){
  const run = !!st.running, t = st.t || 0, lit = st.on || run, p = tmProg(st);
  const scr = rrUV(11, 18, 69, 57, 2);
  let s = shape(lvOn(scr, .5), lit ? '#1d2a26' : '#22282a', 1.4);
  const fade = lit ? 1 : .45;
  let g = '';
  // the search bar
  g += shape(lvOn(rrUV(15.4, 52.5, 64.6, 55.5, 1), .58), '#2c3d37', .5) + shape(lvOn(ellUV(62.4, 54, .9, .9, 8), .6), 'none', .4);
  // the slots and their items
  for (const [i, it] of TM_ITEMS.entries()){
    const [a, b, c, d] = tmSlot(i), cy = (a + c)/2, cz = (b + d)/2;
    g += shape(lvOn(rectUV(a, b, c, d), .58), '#14201c', .4) + tmIcon(it, cy, cz, 2.5);
    if (run && i === TM_JOB) g += ink(pd(lvOn(rectUV(a - .6, b - .6, c + .6, d + .6), .66)), .3)
      + `<path d="${pd(lvOn(rectUV(a - .4, b - .4, c + .4, d + .4), .66))}" fill="none" stroke="#8af0ae" stroke-width="${f(.8 + .5*Math.sin(t*6))}"/>`;
  }
  // the status line: the job's progress bar, or READY
  g += tx(...lvAt(58, 21, .66), run ? 'CRAFTING' : 'READY', 2.5, '#8af0ae', 800);
  g += shape(lvOn(rectUV(15.4, 20.6, 50, 23.6), .6), '#14201c', .4);
  if (run && p > .005) g += fill(pd(lvOn(rectUV(50 - 34.6*p, 21.1, 50, 23.1), .64)), '#8af0ae');
  s += lit ? g : `<g opacity="${fade}">${g}</g>`;
  // glass: a streak of light
  s += fill(pd(lvOn([[66, 50], [60, 56], [57, 56], [66, 47]], .7)), '#ffffff', 'opacity=".18"');
  return s + ink(pd(lvOn(scr, .72)), 1.4);
}

// the keyboard on its shelf, the antenna on the roof
function tmParts(st, k, fade){
  const W = LV.W, run = !!st.running, t = st.t || 0, [ax, ay] = TM.ant, ZT = LV.ZT;
  let keys = '';
  if (facing([0,0,1])) for (let r = 0; r < 3; r++) for (let c = 0; c < 11; c++){
    const x0 = W + 1.3 + r*2.8, y1 = 64.5 - c*4.6;
    if (r === 2 && c > 2 && c < 8){ if (c === 3) keys += shape(on(PZ(13.05), rectUV(x0 + .3, y1 - 4*4.6 - 3.9, x0 + 2.3, y1)), '#e6eaed', .35); continue; }
    keys += shape(on(PZ(13.05), rectUV(x0 + .3, y1 - 3.9, x0 + 2.3, y1)), '#e6eaed', .35);
  }
  const tipC = run ? (Math.sin(t*8) > 0 ? '#8af0ae' : '#2f7a42') : st.on ? '#5fd0b0' : '#5d5650';
  return [
    ...[17, 61].map(y => ({ box: [[W, y, 7], [W + 5, y + 2, 10.5]], svg: fade(box(W, y, 7, W + 5, y + 2, 10.5, GT_TRIM, toneI, .7)) })),
    { box: [[W, 14, 10.5], [W + 10, 66, 13]], svg: fade(box(W, 14, 10.5, W + 10, 66, 13, GT_TRIM, toneI, 1) + keys) },
    { box: [[ax - 4, ay - 4, ZT], [ax + 4, ay + 4, ZT + 20.5]], svg: fade(cyl(ax, ay, ZT, ZT + 3, 4, GT_TRIM, toneI, 1, 18)
      + rod([ax, ay, ZT + 3], [ax, ay, ZT + 18], .7, GT.IRON, toneI, .7)
      + cyl(ax, ay, ZT + 18, ZT + 20.5, 1.6, matOf(tipC), toneI, .8, 12)
      + (run || st.on ? (() => { const [X, Y] = P(ax, ay, ZT + 19.3); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(4.5)}" fill="${tipC}" opacity=".25"/>`; })() : '')) },
  ];
}

function tmInside(st){
  const out = [], put = (b, svg) => out.push({ box: b, svg }), run = !!st.running, [ax, ay] = TM.ant;
  // the screen panel behind the face, its driver board on the back
  put([[64, 10, 17], [72, 70, 58]], box(64, 10, 17, 72, 70, 58, GT_TRIM, toneI, 1)
    + (facing([1,0,0]) ? fill(pd(on(PX(72.1), rectUV(12, 19, 68, 56))), run || st.on ? '#2f5a4c' : '#2a3134') : ''));
  put([[61.5, 22, 24], [64, 58, 50]], box(61.5, 22, 24, 64, 58, 50, GT_PCB, toneI, .9)
    + [[30, 30], [44, 42], [52, 30]].map(([y, z]) => box(60.6, y - 3, z - 2.5, 61.5, y + 3, z + 2.5, GT_TRIM, toneI, .5)).join(''));
  // the radio on the back of the roof, its feed up to the antenna
  put([[44, 52, 66], [56, 68, 76]], box(44, 52, 66, 56, 68, 76, GT_TRIM, toneI, 1)
    + (facing([1,0,0]) ? shape(on(PX(56.1), ellUV(56, 71, 1.2, 1.2, 8)), run ? '#8af0ae' : '#2f7a42', .5) : ''));
  put([[ax - 1, ay - 1, 76], [ax + 1, ay + 1, LV.ZT]], rod([ax, ay, 76], [ax, ay, LV.ZT], .6, DARK, toneI, .6));
  // leads: board to driver, board to radio, keyboard to board
  out.push(gtWire([[4.5, 30, 60], [30, 30, 60], [61.5, 30, 46]], '#6a6f75', .6));
  out.push(gtWire([[4.5, 56, 72], [44, 56, 72]], '#6a6f75', .6));
  out.push(gtWire([[LV.W - 1, 40, 13], [40, 40, 9], [8, 40, 9], [4.5, 40, 46]], '#3d3935', .7));
  return out;
}

gtLv({
  fig:'AE1', title:'Crafting Terminal', name:'TERMINAL', sub:'ME CRAFTING 32 V', noRecipe: true, height: 106,
  face: tmFace, parts: tmParts, inside: tmInside,
  shadowPts: [[TM.ant[0], TM.ant[1], LV.ZT + 20.5]],
  params: (s, q) => { if (q.has('progress')) s.progFixed = true; },
  stats: st => [{ label:'Job', value: st.running ? `${Math.round(tmProg(st)*100)}%` : 'idle' },
    { label:'Energy', value: `${Math.round((st.energy || 0)*100)}%`, small:true }, { label:'Items', value: TM_ITEMS.length, small:true }],
  callouts: st => [
    ...(facing([1,0,0]) ? [{ at: [LV.W, 66, 54], text: 'SCREEN', on: !!st.on }, { at: [LV.W, 50 - 34.6*.5, 22], text: 'PROGRESS BAR', on: !!st.running }] : []),
    { at: [LV.W + 10, 20, 13], text: 'KEYBOARD', on: false }, { at: [TM.ant[0], TM.ant[1], LV.ZT + 20.5], text: 'ANTENNA', on: !!st.running }],
  insideCallouts: st => [{ at: [68, 12, 58], text: 'SCREEN PANEL', on: !!st.on }, { at: [62.5, 52, 50], text: 'SCREEN DRIVER', on: !!st.on },
    { at: [50, 52, 76], text: 'RADIO', on: !!st.running }, { at: [TM.ant[0], TM.ant[1], 80], text: 'ANTENNA FEED', on: !!st.running },
    { at: [40, 40, 9], text: 'KEYBOARD LEAD', on: false }],
});
</script>
<script src="cf-tail.js"></script>
</body></html>
